<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Monitoring Toko Kelontong</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js" defer></script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen">
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6 lg:py-8">

    <section class="bg-white rounded-2xl shadow p-4 sm:p-6 lg:p-7 mb-5 sm:mb-6">
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-emerald-600 leading-tight">
        🏪 Dashboard "Toko Kelontong Bijak Hemat"
      </h1>
    </section>

     <!-- KASIR BERTUGAS -->
    <section id="cashierBox" class="bg-white rounded-2xl shadow p-4 sm:p-6 mb-5 sm:mb-6">
      <h2 class="text-lg sm:text-xl font-semibold mb-4">Kasir Bertugas</h2>

      <div class="flex items-center gap-4">
        <img id="cashierPhoto"
             src="images/Honjouji Rika.jpeg"
             alt="Foto kasir"
             class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover border-2 border-emerald-200 bg-gray-100" />

        <div>
          <p class="text-sm text-gray-500">Nama Kasir</p>
          <p id="cashierName" class="text-xl sm:text-2xl font-bold text-gray-900">-</p>
          <p id="cashierStatus" class="text-sm text-gray-600 mt-1">-</p>
        </div>
      </div>
    </section>

    <section class="mb-5 sm:mb-6">
      <div class="grid grid-cols-3 sm:flex sm:flex-wrap gap-2 sm:gap-3">
        <button onclick="filterData('all')" class="w-full sm:w-auto bg-gray-200 hover:bg-gray-300 px-3 sm:px-4 py-2 rounded-xl text-sm sm:text-base font-medium transition">
          Semua
        </button>
        <button onclick="filterData('operasional')" class="w-full sm:w-auto bg-gray-200 hover:bg-gray-300 px-3 sm:px-4 py-2 rounded-xl text-sm sm:text-base font-medium transition">
          Operasional
        </button>
        <button onclick="filterData('stok')" class="w-full sm:w-auto bg-gray-200 hover:bg-gray-300 px-3 sm:px-4 py-2 rounded-xl text-sm sm:text-base font-medium transition">
          Stok
        </button>
        
      </div>
    </section>

    <section id="summary" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-5 sm:mb-6"></section>

    <section id="errorBox" class="hidden mb-5 sm:mb-6 p-4 rounded-xl bg-red-100 text-red-700 border border-red-200 text-sm sm:text-base"></section>

    <section>
      <div id="container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-5"></div>
    </section>

  </main>
</body>
</html>
